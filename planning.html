<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendrier Éditorial — Workspace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080808;--s1:#0f0f0f;--s2:#161616;--s3:#1e1e1e;
  --b:rgba(255,255,255,.06);--bh:rgba(255,255,255,.14);
  --text:#f0f0f0;--sub:rgba(255,255,255,.4);--dim:rgba(255,255,255,.15);
  --acc:#6366f1;--acc2:#a855f7;--grn:#22c55e;--yel:#f59e0b;--red:#ef4444;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden;display:flex;flex-direction:column}

/* TOP BAR */
.topbar{height:52px;display:flex;align-items:center;gap:16px;padding:0 28px;border-bottom:1px solid var(--b);background:rgba(8,8,8,.9);backdrop-filter:blur(12px);flex-shrink:0}
.tb-back{padding:6px 14px;background:rgba(255,255,255,.06);border:1px solid var(--b);border-radius:8px;color:var(--sub);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;transition:all .15s}
.tb-back:hover{border-color:var(--bh);color:var(--text)}
.tb-logo{font-size:15px;font-weight:700;letter-spacing:-.02em}
.tb-logo span{background:linear-gradient(90deg,#fff,var(--acc));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.tb-sep{width:1px;height:20px;background:var(--b)}
.tb-title{font-size:13px;font-weight:600;color:var(--sub)}

/* MAIN LAYOUT */
.main{flex:1;display:flex;overflow:hidden}

/* CALENDAR */
.cal-zone{flex:1;display:flex;flex-direction:column;padding:24px 28px;overflow-y:auto}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.cal-month{font-size:20px;font-weight:700;color:var(--text)}
.cal-nav{display:flex;gap:8px;align-items:center}
.cal-nav-btn{width:32px;height:32px;background:rgba(255,255,255,.06);border:1px solid var(--b);border-radius:8px;color:var(--sub);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.cal-nav-btn:hover{border-color:var(--bh);color:var(--text)}
.cal-today-btn{padding:6px 14px;background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.2);border-radius:8px;color:var(--acc);font-family:'Inter',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
.cal-today-btn:hover{background:rgba(99,102,241,.2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{font-size:11px;font-weight:600;color:var(--dim);text-align:center;padding:6px 0;letter-spacing:.05em}
.cal-day{min-height:80px;border-radius:10px;padding:8px;background:rgba(255,255,255,.03);border:1px solid transparent;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:3px}
.cal-day:hover{border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.05)}
.cal-day.today{border-color:var(--acc)!important;background:rgba(99,102,241,.06)}
.cal-day.other{opacity:.3}
.cal-day.has-ev{border-color:rgba(255,255,255,.08)}
.cal-day-num{font-size:12px;font-weight:600;color:var(--sub)}
.cal-day.today .cal-day-num{color:var(--acc)}
.cal-event{font-size:9px;padding:3px 7px;border-radius:5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-event.long{background:#6366f1;color:#fff}
.cal-event.short{background:#22c55e;color:#000}
.cal-event.idea{background:#f59e0b;color:#000}

/* SIDEBAR */
.sidebar{width:280px;flex-shrink:0;border-left:1px solid var(--b);display:flex;flex-direction:column;padding:20px;gap:14px;overflow-y:auto}

/* Countdown */
.cd-box{background:linear-gradient(135deg,rgba(99,102,241,.14),rgba(168,85,247,.06));border:1px solid rgba(99,102,241,.2);border-radius:12px;padding:18px;text-align:center}
.cd-lbl{font-size:10px;font-weight:700;color:rgba(99,102,241,.7);letter-spacing:.1em;margin-bottom:8px}
.cd-title{font-size:13px;font-weight:600;color:#fff;margin-bottom:12px;min-height:18px}
.cd-units{display:flex;gap:8px;justify-content:center}
.cd-unit{flex:1;background:rgba(0,0,0,.25);border-radius:8px;padding:10px 4px}
.cd-num{font-size:24px;font-weight:800;color:#fff;display:block;font-variant-numeric:tabular-nums;font-family:'Inter',sans-serif}
.cd-ulbl{font-size:8px;color:rgba(255,255,255,.3);letter-spacing:.08em}
.cd-none{font-size:12px;color:rgba(255,255,255,.25);font-style:italic;padding:8px 0}

/* Summary */
.sum-box{background:rgba(255,255,255,.03);border:1px solid var(--b);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.sum-lbl{font-size:10px;font-weight:700;color:var(--dim);letter-spacing:.08em;margin-bottom:2px}
.sum-row{display:flex;align-items:center;justify-content:space-between}
.sum-row-lbl{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
.sum-row-val{font-size:16px;font-weight:700;color:var(--text)}

/* Upcoming */
.upcoming-box{background:rgba(255,255,255,.03);border:1px solid var(--b);border-radius:12px;padding:14px;flex:1}
.upcoming-lbl{font-size:10px;font-weight:700;color:var(--dim);letter-spacing:.08em;margin-bottom:10px}
.upcoming-item{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.upcoming-item:last-child{border-bottom:none}
.upcoming-date{font-size:10px;color:var(--dim)}
.upcoming-title{font-size:12px;font-weight:600;color:var(--text)}
.upcoming-type{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;width:fit-content;margin-top:2px}
.upcoming-empty{font-size:12px;color:rgba(255,255,255,.2);font-style:italic}

/* EVENT POPUP */
.popup{position:fixed;background:#13131f;border:1px solid rgba(99,102,241,.3);border-radius:14px;padding:18px;width:270px;z-index:9999;box-shadow:0 16px 48px rgba(0,0,0,.8);display:none;flex-direction:column;gap:10px}
.popup.open{display:flex}
.popup-date{font-size:10px;font-weight:700;color:rgba(99,102,241,.7);letter-spacing:.08em}
.popup input{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#fff;font-family:'Inter',sans-serif;font-size:13px;padding:9px 11px;outline:none;width:100%}
.popup input:focus{border-color:var(--acc)}
.popup input::placeholder{color:rgba(255,255,255,.2)}
.pp-time-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pp-lbl{font-size:10px;color:rgba(255,255,255,.3);margin-bottom:4px}
.type-row{display:flex;gap:6px}
.type-btn{flex:1;padding:8px 4px;border-radius:7px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:rgba(255,255,255,.4);font-size:10px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;text-align:center}
.type-btn.on.long{background:#6366f1;border-color:#6366f1;color:#fff}
.type-btn.on.short{background:#22c55e;border-color:#22c55e;color:#000}
.type-btn.on.idea{background:#f59e0b;border-color:#f59e0b;color:#000}
.popup-btns{display:flex;gap:7px}
.pp-save{flex:1;padding:9px;background:var(--acc);border:none;border-radius:8px;color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.pp-save:hover{background:#5254cc}
.pp-del{padding:9px 12px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:8px;color:var(--red);font-size:12px;cursor:pointer;font-family:'Inter',sans-serif}
.pp-cancel{padding:9px;background:none;border:1px solid var(--b);border-radius:8px;color:var(--sub);font-size:12px;cursor:pointer;font-family:'Inter',sans-serif}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <a href="index.html" class="tb-back">← Workspace</a>
  <div class="tb-sep"></div>
  <div class="tb-logo">Work<span>space</span></div>
  <div class="tb-sep"></div>
  <div class="tb-title">📅 Calendrier Éditorial</div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- CALENDAR -->
  <div class="cal-zone">
    <div class="cal-header">
      <div class="cal-month" id="cal-month-lbl"></div>
      <div class="cal-nav">
        <button class="cal-today-btn" onclick="goToday()">Aujourd'hui</button>
        <button class="cal-nav-btn" onclick="navMonth(-1)">‹</button>
        <button class="cal-nav-btn" onclick="navMonth(1)">›</button>
      </div>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <!-- Countdown -->
    <div class="cd-box">
      <div class="cd-lbl">⏱ PROCHAINE VIDÉO</div>
      <div class="cd-title" id="cd-title"></div>
      <div class="cd-units" id="cd-units" style="display:none">
        <div class="cd-unit"><span class="cd-num" id="cd-d">—</span><span class="cd-ulbl">JOURS</span></div>
        <div class="cd-unit"><span class="cd-num" id="cd-h">—</span><span class="cd-ulbl">HEURES</span></div>
        <div class="cd-unit"><span class="cd-num" id="cd-m">—</span><span class="cd-ulbl">MIN</span></div>
        <div class="cd-unit"><span class="cd-num" id="cd-s">—</span><span class="cd-ulbl">SEC</span></div>
      </div>
      <div class="cd-none" id="cd-none">Aucune vidéo planifiée</div>
    </div>

    <!-- Summary -->
    <div class="sum-box">
      <div class="sum-lbl">CE MOIS</div>
      <div class="sum-row"><div class="sum-row-lbl">🎬 Longues</div><div class="sum-row-val" id="sum-long">0</div></div>
      <div class="sum-row"><div class="sum-row-lbl">⚡ Shorts</div><div class="sum-row-val" id="sum-short">0</div></div>
      <div class="sum-row"><div class="sum-row-lbl">💡 Idées</div><div class="sum-row-val" id="sum-idea">0</div></div>
      <div class="sum-row"><div class="sum-row-lbl">📅 Total</div><div class="sum-row-val" id="sum-total">0</div></div>
    </div>

    <!-- Upcoming -->
    <div class="upcoming-box">
      <div class="upcoming-lbl">PROCHAINES VIDÉOS</div>
      <div id="upcoming-list"><div class="upcoming-empty">Aucune vidéo planifiée</div></div>
    </div>
  </div>
</div>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="popup-date" id="popup-date"></div>
  <input id="pp-title" placeholder="Titre de la vidéo…" maxlength="80">
  <div class="pp-time-grid">
    <div><div class="pp-lbl">DATE</div><input type="date" id="pp-date" style="font-size:11px"></div>
    <div><div class="pp-lbl">HEURE</div><input type="time" id="pp-time" value="18:00" style="font-size:11px"></div>
  </div>
  <div class="type-row">
    <button class="type-btn long on" data-type="long" onclick="setType('long')">🎬 Longue</button>
    <button class="type-btn short" data-type="short" onclick="setType('short')">⚡ Short</button>
    <button class="type-btn idea" data-type="idea" onclick="setType('idea')">💡 Idée</button>
  </div>
  <div class="popup-btns">
    <button class="pp-save" onclick="saveEvent()">Sauvegarder</button>
    <button class="pp-del" id="pp-del" onclick="deleteEvent()" style="display:none">Suppr.</button>
    <button class="pp-cancel" onclick="closePopup()">Annuler</button>
  </div>
</div>

<script>
// ═══ STATE ═══
let planYear=new Date().getFullYear(), planMonth=new Date().getMonth();
let planEvents={}, editDate=null, eventType='long';

function loadEvents(){try{planEvents=JSON.parse(localStorage.getItem('loopbuilder_plan')||'{}');}catch(e){planEvents={};}}
function saveEvents(){try{localStorage.setItem('loopbuilder_plan',JSON.stringify(planEvents));}catch(e){}}

const pad=n=>String(n).padStart(2,'0');
function fmtNum(n){if(!n||isNaN(n))return '—';n=+n;if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return Math.round(n/1e3)+'k';return n.toLocaleString('fr-FR');}

// ═══ CALENDAR ═══
const MONTHS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const DAYS=['LUN','MAR','MER','JEU','VEN','SAM','DIM'];

function navMonth(dir){planMonth+=dir;if(planMonth>11){planMonth=0;planYear++;}if(planMonth<0){planMonth=11;planYear--;}render();}
function goToday(){planYear=new Date().getFullYear();planMonth=new Date().getMonth();render();}

function render(){
  loadEvents();
  document.getElementById('cal-month-lbl').textContent=MONTHS[planMonth]+' '+planYear;
  const grid=document.getElementById('cal-grid');
  grid.innerHTML='';
  DAYS.forEach(d=>{const el=document.createElement('div');el.className='cal-dow';el.textContent=d;grid.appendChild(el);});
  const first=new Date(planYear,planMonth,1), last=new Date(planYear,planMonth+1,0);
  const today=new Date(); today.setHours(0,0,0,0);
  const startDow=(first.getDay()+6)%7;
  for(let i=0;i<startDow;i++)grid.appendChild(makeDay(new Date(planYear,planMonth,-(startDow-i-1)),true));
  for(let d=1;d<=last.getDate();d++)grid.appendChild(makeDay(new Date(planYear,planMonth,d),false));
  const total=startDow+last.getDate(), rem=Math.ceil(total/7)*7-total;
  for(let i=1;i<=rem;i++)grid.appendChild(makeDay(new Date(planYear,planMonth+1,i),true));

  // Summary
  let lo=0,sh=0,id=0;
  Object.entries(planEvents).forEach(([k,v])=>{
    const [y,m]=k.split('-').map(Number);
    if(y===planYear&&m-1===planMonth){if(v.type==='long')lo++;else if(v.type==='short')sh++;else id++;}
  });
  document.getElementById('sum-long').textContent=lo;
  document.getElementById('sum-short').textContent=sh;
  document.getElementById('sum-idea').textContent=id;
  document.getElementById('sum-total').textContent=lo+sh+id;

  renderUpcoming();
}

function makeDay(date,other){
  const y=date.getFullYear(), m=String(date.getMonth()+1).padStart(2,'0'), d=String(date.getDate()).padStart(2,'0');
  const key=y+'-'+m+'-'+d;
  const today=new Date(); today.setHours(0,0,0,0);
  const ev=planEvents[key];
  const el=document.createElement('div');
  el.className='cal-day'+(other?' other':'')+(date.getTime()===today.getTime()?' today':'')+(ev?' has-ev':'');
  const num=document.createElement('div'); num.className='cal-day-num'; num.textContent=date.getDate(); el.appendChild(num);
  if(ev){
    const evEl=document.createElement('div'); evEl.className='cal-event '+ev.type;
    evEl.textContent=(ev.type==='long'?'🎬':ev.type==='short'?'⚡':'💡')+' '+(ev.title||ev.type);
    el.appendChild(evEl);
  }
  el.addEventListener('click',e=>openPopup(key,date,e));
  return el;
}

// ═══ UPCOMING ═══
function renderUpcoming(){
  const now=Date.now();
  const upcoming=Object.entries(planEvents)
    .filter(([k,v])=>{const dt=v.datetime?new Date(v.datetime):new Date(k+'T18:00:00');return dt>now;})
    .sort(([,a],[,b])=>new Date(a.datetime||a.date+'T18:00:00')-new Date(b.datetime||b.date+'T18:00:00'))
    .slice(0,8);
  const list=document.getElementById('upcoming-list');
  if(!upcoming.length){list.innerHTML='<div class="upcoming-empty">Aucune vidéo planifiée</div>';return;}
  list.innerHTML='';
  upcoming.forEach(([k,v])=>{
    const dt=v.datetime?new Date(v.datetime):new Date(k+'T18:00:00');
    const dateStr=dt.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})+(v.time?' à '+v.time:'');
    const col=v.type==='long'?'#6366f1':v.type==='short'?'#22c55e':'#f59e0b';
    const item=document.createElement('div'); item.className='upcoming-item';
    item.innerHTML=`<div class="upcoming-date">${dateStr}</div><div class="upcoming-title">${v.title||'(sans titre)'}</div><div class="upcoming-type" style="background:${col}22;color:${col}">${v.type==='long'?'🎬 Longue':v.type==='short'?'⚡ Short':'💡 Idée'}</div>`;
    list.appendChild(item);
  });
}

// ═══ POPUP ═══
function openPopup(dateKey,date,evt){
  closePopup();
  editDate=dateKey;
  const ev=planEvents[dateKey];
  eventType=ev?ev.type:'long';
  const [y,mo,d]=dateKey.split('-').map(Number);
  const disp=new Date(y,mo-1,d);
  document.getElementById('popup-date').textContent=disp.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('pp-title').value=ev?ev.title:'';
  document.getElementById('pp-date').value=dateKey;
  document.getElementById('pp-time').value=ev&&ev.time?ev.time:'18:00';
  document.getElementById('pp-del').style.display=ev?'':'none';
  document.querySelectorAll('.type-btn').forEach(b=>b.classList.toggle('on',b.dataset.type===eventType));
  const popup=document.getElementById('popup');
  const src=evt.currentTarget||evt.target.closest('.cal-day');
  const rect=src.getBoundingClientRect();
  let left=rect.right+10, top=rect.top;
  if(left+280>window.innerWidth)left=rect.left-285;
  if(top+320>window.innerHeight)top=window.innerHeight-330;
  popup.style.left=left+'px'; popup.style.top=Math.max(8,top)+'px';
  popup.classList.add('open');
  document.getElementById('pp-title').focus();
  setTimeout(()=>document.addEventListener('click',closeOnOut),200);
}

function closeOnOut(e){if(!document.getElementById('popup').contains(e.target)){closePopup();document.removeEventListener('click',closeOnOut);}}
function closePopup(){document.getElementById('popup').classList.remove('open');document.removeEventListener('click',closeOnOut);}
function setType(t){eventType=t;document.querySelectorAll('.type-btn').forEach(b=>b.classList.toggle('on',b.dataset.type===t));}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePopup();});

function saveEvent(){
  const title=document.getElementById('pp-title').value.trim();
  const timeVal=document.getElementById('pp-time').value||'18:00';
  if(!editDate)return;
  planEvents[editDate]={title,type:eventType,time:timeVal,datetime:editDate+'T'+timeVal+':00',date:editDate};
  saveEvents(); closePopup(); render(); startCountdown();
}

function deleteEvent(){
  if(!editDate)return;
  delete planEvents[editDate];
  saveEvents(); closePopup(); render(); startCountdown();
}

// ═══ COUNTDOWN ═══
let cdInterval=null;
function getNext(){
  loadEvents();
  const now=Date.now();
  return Object.entries(planEvents)
    .filter(([k,v])=>{const dt=v.datetime?new Date(v.datetime):new Date(k+'T18:00:00');return dt>now&&v.type!=='idea';})
    .sort(([,a],[,b])=>new Date(a.datetime||a.date+'T18:00:00')-new Date(b.datetime||b.date+'T18:00:00'))[0]||null;
}

function startCountdown(){
  if(cdInterval)clearInterval(cdInterval);
  function tick(){
    const next=getNext();
    const cdUnits=document.getElementById('cd-units');
    const cdNone=document.getElementById('cd-none');
    const cdTitle=document.getElementById('cd-title');
    if(!next){
      if(cdTitle)cdTitle.textContent='';
      if(cdUnits)cdUnits.style.display='none';
      if(cdNone)cdNone.style.display='';
      return;
    }
    const [dateKey,ev]=next;
    const target=ev.datetime?new Date(ev.datetime):new Date(dateKey+'T18:00:00');
    const diff=target-Date.now();
    if(diff<=0){tick();return;}
    const d=Math.floor(diff/86400000), h=Math.floor((diff%86400000)/3600000), m=Math.floor((diff%3600000)/60000), s=Math.floor((diff%60000)/1000);
    if(cdTitle)cdTitle.textContent=ev.title||'Vidéo planifiée';
    if(cdNone)cdNone.style.display='none';
    if(cdUnits)cdUnits.style.display='flex';
    const dEl=document.getElementById('cd-d'), hEl=document.getElementById('cd-h'), mEl=document.getElementById('cd-m'), sEl=document.getElementById('cd-s');
    if(dEl)dEl.textContent=d; if(hEl)hEl.textContent=pad(h); if(mEl)mEl.textContent=pad(m); if(sEl)sEl.textContent=pad(s);
  }
  tick(); cdInterval=setInterval(tick,1000);
}

// ═══ INIT ═══
render();
startCountdown();
</script>
</body>
</html>
