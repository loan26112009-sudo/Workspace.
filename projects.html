<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mes Projets — Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070f;
  --s1:#0f0f1a;
  --s2:#14141f;
  --s3:#1c1c2e;
  --b:rgba(255,255,255,.07);
  --bh:rgba(255,255,255,.15);
  --text:#f0f0f0;
  --sub:rgba(255,255,255,.55);
  --dim:rgba(255,255,255,.2);
  --acc:#6366f1;
  --acc2:#a855f7;
  --grn:#22c55e;
  --red:#ef4444;
  --yel:#f59e0b;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}

/* ── BG GLOW ── */
.bg-glow{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 70% 50% at 20% -10%,rgba(99,102,241,.18) 0%,transparent 60%),
    radial-gradient(ellipse 50% 40% at 90% 90%,rgba(168,85,247,.12) 0%,transparent 55%),
    radial-gradient(ellipse 40% 30% at 60% 50%,rgba(99,102,241,.06) 0%,transparent 60%);}

/* ── NAV ── */
.top-nav{position:sticky;top:0;z-index:100;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;
  background:rgba(7,7,15,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--b);}
.top-nav-logo{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;text-decoration:none;color:var(--text)}
.top-nav-logo-dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));flex-shrink:0}
.back-btn{display:flex;align-items:center;gap:6px;padding:8px 16px;background:rgba(255,255,255,.06);border:1px solid var(--b);border-radius:10px;color:var(--sub);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;transition:all .2s}
.back-btn:hover{background:rgba(255,255,255,.1);color:var(--text)}

/* ── HERO ── */
.hero{padding:60px 28px 40px;text-align:center;position:relative;z-index:1}
.hero-label{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--acc);text-transform:uppercase;margin-bottom:14px}
.hero-title{font-size:clamp(32px,6vw,72px);font-weight:900;letter-spacing:-.04em;line-height:1.05;margin-bottom:10px}
.hero-title span{background:linear-gradient(90deg,#fff 20%,var(--acc) 60%,var(--acc2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-handle{font-size:clamp(20px,4vw,42px);font-weight:800;letter-spacing:-.03em;color:var(--acc);opacity:.85}
.hero-sub{font-size:14px;color:var(--dim);margin-top:10px}
.hero-stats{display:flex;justify-content:center;gap:28px;margin-top:32px;flex-wrap:wrap}
.hero-stat{text-align:center}
.hero-stat-val{font-size:28px;font-weight:900;letter-spacing:-.03em;color:var(--text)}
.hero-stat-lbl{font-size:11px;color:var(--dim);font-weight:600;margin-top:2px}

/* ── TOOLBAR ── */
.toolbar{position:relative;z-index:1;padding:0 28px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.search-wrap{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--b);border-radius:12px;padding:0 14px;flex:1;min-width:200px;max-width:360px}
.search-ico{color:var(--dim);font-size:15px}
.search-input{background:none;border:none;outline:none;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:11px 0;width:100%}
.search-input::placeholder{color:var(--dim)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:9px 16px;border-radius:10px;border:1px solid var(--b);background:rgba(255,255,255,.04);color:rgba(255,255,255,.4);font-size:11.5px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;white-space:nowrap}
.chip:hover{border-color:var(--bh);color:#fff}
.chip.sel{background:rgba(99,102,241,.18);border-color:rgba(99,102,241,.4);color:var(--acc)}
.new-btn{padding:10px 20px;background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;border-radius:12px;color:#fff;font-family:'Inter',sans-serif;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .2s;display:flex;align-items:center;gap:6px}
.new-btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(99,102,241,.35)}

/* ── GRID ── */
.projects-grid{position:relative;z-index:1;padding:0 28px 80px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:24px}

/* ── PROJECT CARD ── */
.proj-card{background:var(--s1);border:1px solid var(--b);border-radius:20px;overflow:hidden;cursor:pointer;transition:all .3s cubic-bezier(.16,1,.3,1);position:relative;animation:cardIn .4s cubic-bezier(.16,1,.3,1) both}
.proj-card::after{content:'';position:absolute;inset:0;border-radius:20px;padding:1px;background:transparent;-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;transition:background .3s;z-index:2}
.proj-card:hover{transform:translateY(-6px);box-shadow:0 28px 60px rgba(0,0,0,.6),0 0 0 1px rgba(99,102,241,.2)}
.proj-card:hover::after{background:linear-gradient(135deg,rgba(99,102,241,.6),rgba(168,85,247,.4))}
.proj-card.urgent:hover{box-shadow:0 28px 60px rgba(0,0,0,.6),0 0 0 1px rgba(239,68,68,.25)}
.proj-card.urgent::after{background:linear-gradient(135deg,rgba(239,68,68,.5),rgba(245,158,11,.3))}
@keyframes cardIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* THUMB */
.proj-thumb{width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,var(--s2),var(--s3));position:relative;overflow:hidden;flex-shrink:0}
.proj-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.16,1,.3,1)}
.proj-card:hover .proj-thumb img{transform:scale(1.06)}
.proj-thumb-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:56px;opacity:.08;transition:all .3s}
.proj-card:hover .proj-thumb-ph{opacity:.14;transform:scale(1.1)}
.proj-thumb-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(7,7,15,.8) 100%);opacity:0;transition:opacity .3s}
.proj-card:hover .proj-thumb-overlay{opacity:1}
.proj-thumb-edit{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:10px;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.8);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(-4px);transition:all .2s;z-index:5}
.proj-card:hover .proj-thumb-edit{opacity:1;transform:translateY(0)}
.proj-thumb-edit:hover{background:var(--acc);border-color:var(--acc)}
.proj-urgent-dot{position:absolute;top:12px;left:12px;background:var(--red);color:#fff;font-size:9px;font-weight:900;padding:4px 10px;border-radius:8px;letter-spacing:.04em;display:flex;align-items:center;gap:5px;z-index:5}
.proj-urgent-pulse{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}

/* BODY */
.proj-body{padding:18px 20px 16px}
.proj-title-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
.proj-title{font-size:17px;font-weight:800;letter-spacing:-.02em;flex:1;line-height:1.3}
.proj-del{opacity:0;background:none;border:none;color:var(--dim);cursor:pointer;font-size:16px;padding:2px 4px;transition:all .15s;flex-shrink:0}
.proj-card:hover .proj-del{opacity:1}
.proj-del:hover{color:var(--red)}
.proj-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.badge{padding:4px 10px;border-radius:7px;font-size:10.5px;font-weight:700}
.badge-idea{background:rgba(245,158,11,.12);color:var(--yel)}
.badge-progress{background:rgba(99,102,241,.12);color:var(--acc)}
.badge-published{background:rgba(34,197,94,.12);color:var(--grn)}
.badge-urgent{background:rgba(239,68,68,.12);color:var(--red)}
.badge-ok{background:rgba(34,197,94,.1);color:var(--grn)}
.badge-soon{background:rgba(245,158,11,.1);color:var(--yel)}
.proj-footer{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--b)}
.proj-meta{font-size:11px;color:var(--dim)}
.proj-open-btn{padding:7px 14px;background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.2);border-radius:9px;color:var(--acc);font-family:'Inter',sans-serif;font-size:11.5px;font-weight:700;cursor:pointer;transition:all .15s}
.proj-open-btn:hover{background:rgba(99,102,241,.22);transform:translateY(-1px)}
.proj-progress-bar{height:3px;background:rgba(255,255,255,.07);border-radius:2px;margin-bottom:8px;overflow:hidden}
.proj-progress-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .4s cubic-bezier(.16,1,.3,1)}

/* ── EMPTY ── */
.empty-state{grid-column:1/-1;text-align:center;padding:80px 20px;position:relative;z-index:1}
.empty-orb{width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,.2),transparent);margin:0 auto 24px;display:flex;align-items:center;justify-content:center;font-size:40px}
.empty-title{font-size:20px;font-weight:800;color:#fff;margin-bottom:8px}
.empty-sub{font-size:13px;color:var(--dim);max-width:300px;margin:0 auto 24px}

/* ── MODAL NOUVEAU PROJET ── */
.modal-bg{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--s2);border:1px solid var(--b);border-radius:20px;padding:32px;width:100%;max-width:480px;box-shadow:0 32px 80px rgba(0,0,0,.6)}
.modal-title{font-size:20px;font-weight:900;margin-bottom:20px}
.modal-field{margin-bottom:14px}
.modal-label{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;display:block}
.modal-input{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--b);border-radius:10px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;padding:11px 14px;outline:none;transition:border-color .2s}
.modal-input:focus{border-color:rgba(99,102,241,.5)}
.modal-status-row{display:flex;gap:8px}
.modal-status-chip{flex:1;padding:9px;background:rgba(255,255,255,.04);border:1px solid var(--b);border-radius:9px;color:var(--sub);font-family:'Inter',sans-serif;font-size:12px;font-weight:700;cursor:pointer;text-align:center;transition:all .15s}
.modal-status-chip.sel{background:rgba(99,102,241,.15);border-color:rgba(99,102,241,.4);color:var(--acc)}
.modal-actions{display:flex;gap:10px;margin-top:24px;justify-content:flex-end}
.modal-cancel{padding:10px 18px;background:rgba(255,255,255,.06);border:1px solid var(--b);border-radius:10px;color:var(--sub);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer}
.modal-confirm{padding:10px 22px;background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;border-radius:10px;color:#fff;font-family:'Inter',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s}
.modal-confirm:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(99,102,241,.4)}

/* ── MOBILE ── */
@media(max-width:640px){
  .hero{padding:40px 16px 28px}
  .hero-title{font-size:clamp(24px,8vw,48px)}
  .hero-stats{gap:20px}
  .toolbar{padding:0 16px 18px;gap:8px}
  .projects-grid{padding:0 16px 60px;gap:16px;grid-template-columns:1fr}
  .search-wrap{max-width:100%;flex:none;width:100%}
  .back-btn span{display:none}
  .top-nav{padding:0 16px}
  .modal{border-radius:16px;padding:24px}
}
@media(max-width:440px){
  .hero-stats{gap:16px}
  .hero-stat-val{font-size:22px}
  .proj-title{font-size:15px}
  .chip{padding:7px 12px;font-size:11px}
}
</style>
</head>
<body>
<div class="bg-glow"></div>

<!-- NAV -->
<nav class="top-nav">
  <a href="index.html" class="back-btn">← <span>Workspace</span></a>
  <a href="index.html" class="top-nav-logo">
    <div class="top-nav-logo-dot"></div>
    <span>Workspace</span>
  </a>
  <button class="new-btn" onclick="openNewModal()">+ Nouveau projet</button>
</nav>

<!-- HERO -->
<div class="hero">
  <div class="hero-label">Tableau de bord créateur</div>
  <div class="hero-title">Gestionnaire de projets de</div>
  <div class="hero-handle" id="hero-handle">@Loaaannn</div>
  <div class="hero-sub" id="hero-sub">Tous tes projets YouTube au même endroit.</div>
  <div class="hero-stats">
    <div class="hero-stat">
      <div class="hero-stat-val" id="stat-total">0</div>
      <div class="hero-stat-lbl">Projets</div>
    </div>
    <div class="hero-stat">
      <div class="hero-stat-val" id="stat-wip">0</div>
      <div class="hero-stat-lbl">En cours</div>
    </div>
    <div class="hero-stat">
      <div class="hero-stat-val" id="stat-pub">0</div>
      <div class="hero-stat-lbl">Publiées</div>
    </div>
    <div class="hero-stat">
      <div class="hero-stat-val" id="stat-idea">0</div>
      <div class="hero-stat-lbl">Idées</div>
    </div>
  </div>
</div>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="search-wrap">
    <span class="search-ico">⌕</span>
    <input class="search-input" id="search-input" placeholder="Rechercher un projet…" oninput="renderGrid()">
  </div>
  <div class="filters">
    <button class="chip sel" data-f="all" onclick="setFilter('all',this)">Tous</button>
    <button class="chip" data-f="idea" onclick="setFilter('idea',this)">💡 Idées</button>
    <button class="chip" data-f="wip" onclick="setFilter('wip',this)">🎬 En cours</button>
    <button class="chip" data-f="published" onclick="setFilter('published',this)">✅ Publiées</button>
    <button class="chip" data-f="urgent" onclick="setFilter('urgent',this)">🔥 Urgents</button>
  </div>
</div>

<!-- GRID -->
<div class="projects-grid" id="projects-grid"></div>

<!-- MODAL NOUVEAU PROJET -->
<div class="modal-bg" id="new-modal">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">✨ Nouveau projet</div>
    <div class="modal-field">
      <label class="modal-label">Titre de la vidéo</label>
      <input class="modal-input" id="new-name" placeholder="J'ai vécu 100h en réalité virtuelle…" onkeydown="if(event.key==='Enter')confirmNew()">
    </div>
    <div class="modal-field">
      <label class="modal-label">Statut</label>
      <div class="modal-status-row">
        <button class="modal-status-chip" data-s="idea" onclick="pickStatus(this)">💡 Idée</button>
        <button class="modal-status-chip sel" data-s="progress" onclick="pickStatus(this)">🎬 En cours</button>
        <button class="modal-status-chip" data-s="published" onclick="pickStatus(this)">✅ Publiée</button>
      </div>
    </div>
    <div class="modal-field">
      <label class="modal-label">Deadline vidéo</label>
      <input class="modal-input" id="new-deadline" type="date">
    </div>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeNewModal()">Annuler</button>
      <button class="modal-confirm" onclick="confirmNew()">Créer →</button>
    </div>
  </div>
</div>

<script>
const PM_KEY='loopbuilder_projects_v1';
const PLAN_KEY='loopbuilder_plan';
const uid=()=>Math.random().toString(36).slice(2,10);

function getProjects(){try{return JSON.parse(localStorage.getItem(PM_KEY)||'[]')}catch(e){return[]}}
function saveProjects(l){try{localStorage.setItem(PM_KEY,JSON.stringify(l))}catch(e){}}
function getPlanEvents(){try{return JSON.parse(localStorage.getItem(PLAN_KEY)||'{}')}catch(e){return{}}}
function savePlanEvents(e){try{localStorage.setItem(PLAN_KEY,JSON.stringify(e))}catch(e){}}

// Read YouTube handle
function getHandle(){
  try{const ch=JSON.parse(localStorage.getItem('loopbuilder_ch')||'{}');return ch.customUrl||ch.name||null}catch(e){return null}
}

let activeFilter='all';

function setFilter(f,btn){
  activeFilter=f;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('sel',c===btn));
  renderGrid();
}

function urgency(p){
  if(!p.deadline)return null;
  const dl=new Date(p.deadline+'T12:00:00'),now=new Date();now.setHours(0,0,0,0);
  return Math.round((dl-now)/86400000);
}

function syncDeadlineToCalendar(p){
  if(!p.deadline||!p.name)return;
  const events=getPlanEvents();
  // Remove old entry for this project
  for(const k of Object.keys(events)){
    if((events[k].title||'').trim().toLowerCase()===(p.name||'').trim().toLowerCase()) delete events[k];
  }
  events[p.deadline]={title:p.name,type:'long',time:'18:00',datetime:p.deadline+'T18:00:00',date:p.deadline};
  savePlanEvents(events);
}

function renderGrid(){
  const grid=document.getElementById('projects-grid');
  let projects=getProjects().sort((a,b)=>(b.updated||0)-(a.updated||0));
  
  // Stats
  document.getElementById('stat-total').textContent=projects.length;
  document.getElementById('stat-wip').textContent=projects.filter(p=>(p.status||'progress')==='progress').length;
  document.getElementById('stat-pub').textContent=projects.filter(p=>p.status==='published').length;
  document.getElementById('stat-idea').textContent=projects.filter(p=>p.status==='idea').length;

  const q=(document.getElementById('search-input').value||'').toLowerCase().trim();
  if(q) projects=projects.filter(p=>(p.name||'').toLowerCase().includes(q));

  if(activeFilter==='idea') projects=projects.filter(p=>(p.status||'progress')==='idea');
  else if(activeFilter==='wip') projects=projects.filter(p=>(p.status||'progress')==='progress');
  else if(activeFilter==='published') projects=projects.filter(p=>p.status==='published');
  else if(activeFilter==='urgent') projects=projects.filter(p=>{const u=urgency(p);return u!==null&&u<=3&&p.status!=='published';});

  if(!projects.length){
    grid.innerHTML=`<div class="empty-state">
      <div class="empty-orb">🎬</div>
      <div class="empty-title">${activeFilter==='all'?'Ton premier projet t\'attend':'Aucun projet ici'}</div>
      <div class="empty-sub">${activeFilter==='all'?'Crée ton premier projet et commence à construire ta chaîne.':'Essaie un autre filtre ou crée un nouveau projet.'}</div>
      ${activeFilter==='all'?'<button class="new-btn" style="margin:0 auto" onclick="openNewModal()">+ Créer mon premier projet</button>':''}
    </div>`;
    return;
  }

  const statusMap={idea:{lbl:'💡 Idée',cls:'badge-idea'},progress:{lbl:'🎬 En cours',cls:'badge-progress'},published:{lbl:'✅ Publiée',cls:'badge-published'}};

  grid.innerHTML=projects.map((p,idx)=>{
    const status=p.status||'progress';
    const st=statusMap[status]||statusMap.progress;
    const u=urgency(p);
    const isUrgent=u!==null&&u<=3&&status!=='published';
    let dlBadge='';
    if(u!==null&&status!=='published'){
      const cls=u<0?'badge-urgent':u<=10?'badge-urgent':u<=14?'badge-soon':'badge-ok';
      const txt=u<0?'En retard':u===0?"Aujourd'hui":u===1?'Demain':'Dans '+u+'j';
      dlBadge=`<span class="badge ${cls}">⏱ ${txt}</span>`;
    }
    const loops=p.state?.arcs?.length||0;
    const prog=Math.min(100,Math.round((loops/5)*100));
    return `<div class="proj-card${isUrgent?' urgent':''}" style="animation-delay:${Math.min(idx*40,300)}ms" onclick="openProject('${p.id}')">
      <div class="proj-thumb">
        ${p.thumb?`<img src="${p.thumb}" alt="">`:`<div class="proj-thumb-ph">🎬</div>`}
        <div class="proj-thumb-overlay"></div>
        <button class="proj-thumb-edit" onclick="event.stopPropagation();triggerThumb('${p.id}')" title="Changer la miniature">✏</button>
        <input type="file" accept="image/*" style="display:none" id="thumb-input-${p.id}" onchange="thumbChange('${p.id}',this)">
        ${isUrgent?`<div class="proj-urgent-dot"><span class="proj-urgent-pulse"></span>${u<0?'RETARD':u===0?"AUJOURD'HUI":'DEMAIN'}</div>`:''}
      </div>
      <div class="proj-body">
        <div class="proj-title-row">
          <div class="proj-title">${escHtml(p.name||'Sans titre')}</div>
          <button class="proj-del" onclick="event.stopPropagation();deleteProject('${p.id}')" title="Supprimer">×</button>
        </div>
        <div class="proj-badges">
          <span class="badge ${st.cls}">${st.lbl}</span>
          ${dlBadge}
        </div>
        ${loops>0?`<div class="proj-progress-bar"><div class="proj-progress-fill" style="width:${prog}%"></div></div>`:''}
        <div class="proj-footer">
          <div class="proj-meta">${p.deadline?'🗓 '+new Date(p.deadline+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'}):loops>0?loops+' boucle'+(loops>1?'s':''):'Aucune boucle'}</div>
          <button class="proj-open-btn" onclick="event.stopPropagation();openProject('${p.id}')">Ouvrir →</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function escHtml(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function openProject(id){
  // Navigate to loop-builder with the project open
  window.location.href='loop-builder.html?project='+id;
}

function triggerThumb(id){document.getElementById('thumb-input-'+id).click();}
function thumbChange(id,input){
  const file=input.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=e=>{
    const list=getProjects();
    const p=list.find(x=>x.id===id);
    if(p){p.thumb=e.target.result;p.updated=Date.now();saveProjects(list);}
    renderGrid();
  };
  r.readAsDataURL(file);
  input.value='';
}
function deleteProject(id){
  if(!confirm('Supprimer ce projet ?'))return;
  saveProjects(getProjects().filter(p=>p.id!==id));
  renderGrid();
}

// ── MODAL NOUVEAU PROJET ──
let newStatus='progress';
function openNewModal(){
  document.getElementById('new-name').value='';
  document.getElementById('new-deadline').value='';
  newStatus='progress';
  document.querySelectorAll('.modal-status-chip').forEach(c=>c.classList.toggle('sel',c.dataset.s===newStatus));
  document.getElementById('new-modal').classList.add('open');
  setTimeout(()=>document.getElementById('new-name').focus(),100);
}
function closeNewModal(){document.getElementById('new-modal').classList.remove('open');}
function pickStatus(btn){
  newStatus=btn.dataset.s;
  document.querySelectorAll('.modal-status-chip').forEach(c=>c.classList.toggle('sel',c===btn));
}
function confirmNew(){
  const name=document.getElementById('new-name').value.trim();
  if(!name){document.getElementById('new-name').focus();return;}
  const deadline=document.getElementById('new-deadline').value;
  const p={id:uid(),name,status:newStatus,deadline,thumb:null,notes:'',created:Date.now(),updated:Date.now()};
  const list=getProjects();list.unshift(p);saveProjects(list);
  if(deadline) syncDeadlineToCalendar(p);
  closeNewModal();
  renderGrid();
}
document.getElementById('new-modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeNewModal();});

// ── INIT ──
function init(){
  const h=getHandle();
  if(h) document.getElementById('hero-handle').textContent='@'+h.replace(/^@/,'');
  renderGrid();
}
init();
</script>
